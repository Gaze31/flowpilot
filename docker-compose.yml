services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: flowpilot
      POSTGRES_PASSWORD: flowpilot
      POSTGRES_DB: flowpilot
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowpilot"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://flowpilot:flowpilot@db:5432/flowpilot
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: ./backend
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://flowpilot:flowpilot@db:5432/flowpilot
      REDIS_URL: redis://redis:6379/0
    depends_on: [api]
    # Week 2 experiment: `docker compose up --scale worker=2` and start two runs at once

volumes:
  pgdata:
