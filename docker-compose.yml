services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowpilot
      POSTGRES_PASSWORD: flowpilot
      POSTGRES_DB: flowpilot
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowpilot"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]

  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://flowpilot:flowpilot@db:5432/flowpilot
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: ./backend
    command: python -m app.worker
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://flowpilot:flowpilot@db:5432/flowpilot
      REDIS_URL: redis://redis:6379/0
    depends_on: [api]
    # Try `docker compose up --scale worker=2` and start two runs at once

  scheduler:
    build: ./backend
    command: python -m app.engine.scheduler
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://flowpilot:flowpilot@db:5432/flowpilot
      REDIS_URL: redis://redis:6379/0
    depends_on: [api]

volumes:
  pgdata: